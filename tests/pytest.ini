# Tests of all components. Run with tests/run.sh (or: pytest -c tests/pytest.ini).
# Paths are relative to this directory.
[pytest]
testpaths = ../src/core/tests ../src/web/tests
pythonpath = ../src/common/src ../src/core/src ../src/web/src ../src/core/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
